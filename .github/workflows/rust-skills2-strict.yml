name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict-rust:
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - workloads/challenge-sha256-scaling-v1/rust
          - workloads/challenge-sha256-v1/implementations/rust-challenge-simd
          - workloads/hashwx-fixed-v1/implementations/cranelift-direct
          - workloads/hashwx-fixed-v1/implementations/rust-dynasm
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@208054fbf37368876010035be88315953a1cf9f9 # main
    with:
      rust-toolchain: nightly-2026-11-22
      working-directory: ${{ matrix.workspace }}
      cargo-args: "--locked --workspace --all-targets --all-features"
      # Python is an intentional benchmark language (CPython, PyPy, RPython
      # and Wasmtime bindings). The shared Ruff and ty checks remain enabled.
      ban-python-outside-ci: false
