name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict-rust:
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - tools/benchmark
          - workloads/challenge-sha256-scaling-v1/rust
          - workloads/challenge-sha256-v1/implementations/rust-challenge-simd
          - workloads/hashwx-fixed-v1/implementations/cranelift-direct
          - workloads/hashwx-fixed-v1/implementations/rust-dynasm
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      working-directory: ${{ matrix.workspace }}
      cargo-args: "--locked --workspace --all-targets --all-features"
      # Python is an intentional benchmark language (CPython, PyPy, RPython
      # and Wasmtime bindings). The shared Ruff and ty checks remain enabled.
      ban-python-outside-ci: false

  rust-tests:
    name: Maintained Rust workspace tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
    with:
      command: |
        cargo test --locked --workspace --all-features --manifest-path tools/benchmark/Cargo.toml
        cargo test --locked --workspace --all-features --manifest-path workloads/challenge-sha256-scaling-v1/rust/Cargo.toml
        cargo test --locked --workspace --all-features --manifest-path workloads/challenge-sha256-v1/implementations/rust-challenge-simd/Cargo.toml
        cargo test --locked --workspace --all-features --manifest-path workloads/hashwx-fixed-v1/implementations/cranelift-direct/Cargo.toml
        cargo test --locked --workspace --all-features --manifest-path workloads/hashwx-fixed-v1/implementations/rust-dynasm/Cargo.toml

  tool-contracts:
    name: Benchmark tool contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          enable-cache: false
      - run: shellcheck tools/build-cpython-jit.sh tools/build-rpython-jitdriver.sh
      - run: uv run --no-project python -m unittest discover -s tools/tests -v
