[package]
name = "museum-sha256-thread-scaling"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
challenge-solvers = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "3fe3a96faf9bc59128da427e4df8df3f26cfecb5", default-features = false, features = ["std", "compare-64bit"] }
libc = "0.2"
