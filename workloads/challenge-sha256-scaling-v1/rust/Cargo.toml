[package]
name = "museum-sha256-thread-scaling"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
challenge-solvers = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "ccc94fa3603f8abd7219dd784b049caf5f5fa536", default-features = false, features = ["std", "compare-64bit"] }
libc = "0.2"
sha2 = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
