[package]
name = "museum-zipp-gpu"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hashwx = { git = "https://github.com/codeandsolder/hashwx-rs", rev = "44d5543273329843bf61268c8b0756798c86fb8e", default-features = false, features = ["hashx", "native"] }
zipp-gpu = { git = "https://github.com/f2i-com/zipp.org", rev = "9507aa98bb4dba013eaab4e684b5cbe39e5d593c" }
