[package]
name = "museum-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["now"] }
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
nix = { version = "0.31.3", features = ["hostname", "process", "sched", "signal", "feature"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
shlex = "1.3.0"
tempfile = "3.27.0"
toml = "1.1.6"
uuid = { version = "1.23.1", features = ["v4"] }
